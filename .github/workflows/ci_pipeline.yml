name: Python CI Pipeline - Sistem Perpustakaan

# Pipeline akan berjalan otomatis saat ada push atau pull request ke branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "modul 3"

    steps:
      - name: 1. Mengambil Kode dari Repository (Checkout)
        uses: actions/checkout@v4

      - name: 2. Menyiapkan Lingkungan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Menginstal Dependensi Sistem (Tkinter & Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: 4. Menginstal Dependensi Proyek
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest mysql-connector-python customtkinter
          fi

      - name: 5. Menjalankan Linter (Flake8)
        run: |
          flake8 models/ controller/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 6. Menjalankan Automated Unit Testing (Pytest)
        env:
          PYTHONPATH: .
        run: |
          xvfb-run -a python -m pytest test/ -v
